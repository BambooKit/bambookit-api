# Render Blueprint for bambookit-api (https://render.com/docs/blueprint-spec).
# The existing service can keep its dashboard settings; this file documents the expected ones.
services:
  - type: web
    name: bambookit-api
    runtime: node
    plan: free
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: "22.13.1"
      - key: NODE_ENV
        value: production
      # Persistent storage. Without it, Render's disk is wiped on every restart or deploy.
      # Supabase → Project settings → Database → Connection string (Session pooler, port 5432).
      - key: POSTGRES_URL
        sync: false
      - key: SUPABASE_URL
        value: https://skvjitpcpwfprgxvnpdd.supabase.co
      - key: FIREBASE_PROJECT_ID
        value: bambookit-product
      - key: PUBLIC_SHARE_BASE_URL
        value: https://bambookit-web.onrender.com
      - key: CORS_ORIGINS
        value: https://bambookit-web.onrender.com,http://localhost:3000
      # Payments (Cashfree). Webhook URL: https://<this service>/v1/billing/cashfree/webhook
      - key: CASHFREE_APP_ID
        sync: false
      - key: CASHFREE_SECRET_KEY
        sync: false
      - key: CASHFREE_ENV
        value: sandbox
      # Rewarded ads: AdMob SSV callback URL https://<this service>/v1/rewards/admob-ssv
      - key: REWARD_SIGNING_SECRET
        sync: false
      # Releases: optional GitHub token for GET /v1/releases/latest (public repos need no scopes; raises the
      # rate limit from 60 to 5,000 req/h). The last good answer is cached and served stale on GitHub outages.
      - key: GITHUB_TOKEN
        sync: false
