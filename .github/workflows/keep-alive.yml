# Backup wake-up for the Render free-tier API (the API also pings itself every 10 minutes while it
# runs; this wakes it again if it was ever stopped). GitHub may delay or skip scheduled runs, so an
# external monitor such as UptimeRobot pointed at /ready is the most reliable extra safeguard.
name: keep-alive
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping BambooKit API
        run: curl --silent --show-error --fail --max-time 90 --retry 2 https://bambookit-api.onrender.com/ready
