# Keeps the Render free-tier API awake: Render stops a free web service after ~15 minutes without
# traffic, and the next request then waits 20-50 s for a cold start. One always-on free service
# fits within Render's 750 free instance hours per month.
name: keep-alive
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping BambooKit API
        run: curl --silent --show-error --fail --max-time 90 --retry 2 https://bambookit-api.onrender.com/health
